<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D111A" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="electricBlueCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="55%" stop-color="#00B8FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="glossyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0A84FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00E5FF" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Dark Black Squircle Background (#0A0A0A) -->
  <rect width="512" height="512" rx="116" fill="url(#bgDark)" />
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="url(#electricBlueCyan)" stroke-width="3" stroke-opacity="0.35" />
  <circle cx="256" cy="248" r="210" fill="url(#coreGlow)" />

  <!-- 3D Glossy Letter B Merged with Upward Rocket / Boost Arrow -->
  <g filter="url(#drop3d)">
    <!-- Upward Boost Rocket Spine + Arrowhead + Letter B Loops -->
    <path
      d="M226 84 L154 166 H198 V396 H292 C354 396 394 360 394 310 C394 274 371 246 335 236 C363 224 380 199 380 168 C380 122 342 92 284 92 H254 L226 84 Z
         M254 144 H282 C308 144 324 156 324 176 C324 196 308 208 282 208 H254 V144 Z
         M254 260 H290 C320 260 338 275 338 300 C338 325 320 340 290 340 H254 V260 Z"
      fill="url(#electricBlueCyan)"
      fill-rule="evenodd"
    />
    <!-- Rocket Boost Arrow Pointing Up From the B Spine -->
    <path
      d="M226 68 L142 168 H194 V412 H258 V168 H310 L226 68 Z"
      fill="url(#electricBlueCyan)"
    />
    <!-- Specular White 3D Top Highlight -->
    <path
      d="M226 74 L154 160 H198 V250 C226 225 278 205 338 205 C355 194 368 178 368 160 C368 124 334 96 282 96 H246 L226 74 Z"
      fill="url(#glossyHighlight)"
    />
    <!-- Rocket Thruster Flame Plume at Base -->
    <path
      d="M204 422 L226 456 L248 422 Z"
      fill="#00E5FF"
    />
    <path
      d="M214 422 L226 442 L238 422 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>

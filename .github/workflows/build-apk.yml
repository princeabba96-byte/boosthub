name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK (com.boosthub.society)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure google-services.json in app directory
        run: |
          mkdir -p android/app
          cp android/app/google-services.json android/app/google-services.json

      - name: Ensure Keystore Exists
        run: |
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias boosthub-key -keyalg RSA -keysize 2048 -validity 10000 -storepass boosthub2026 -keypass boosthub2026 -dname "CN=BoostHub, OU=Mobile, O=BoostHub Society, L=Aba, ST=Abia, C=NG"
          fi

      - name: Grant Execute Permission to gradlew
        run: |
          chmod +x android/gradlew || true

      - name: Build Release APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy Signed APK to Artifact Location
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/BoostHub-signed.apk
          cp android/app/build/outputs/apk/release/app-release.apk BoostHub.apk
          cp android/app/build/outputs/apk/release/app-release.apk public/BoostHub.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostHub-v2.0.0-signed
          path: dist-apk/BoostHub-signed.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: BoostHub Hybrid Native APK v2.0.0
          body: |
            ### BoostHub Hybrid Native Android APK (Production)
            - **Package**: `com.boosthub.society`
            - **Min SDK**: 21 (Android 5.0+)
            - **Target SDK**: 34 (Android 14)
            - **Firebase Cloud Messaging**: Integrated with project `boost-hub-bd22d`
            - **Signed**: Production release keystore
          files: |
            dist-apk/BoostHub-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

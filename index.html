<!doctype html>
<html lang="en" style="background-color: #060813; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A84FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BoostHub" />
    <title>BoostHub</title>
    <meta
      name="description"
      content="BoostHub — Social & Creator Platform featuring personalized feeds, Capshots short videos, stories, real-time messaging, B-Shop, and creator analytics."
    />
    <meta property="og:title" content="BoostHub" />
    <meta
      property="og:description"
      content="BoostHub — Social & Creator Platform featuring personalized feeds, Capshots short videos, stories, real-time messaging, B-Shop, and creator analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #060813;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
      }
      @keyframes bh-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // Preserve native browser fetch before any iframe shim wraps it
      if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
        window.__nativeFetch = window.fetch.bind(window);
      }

      window.addEventListener(
        'error',
        function (e) {
          if (e && (e.message === 'Script error.' || e.message === 'Script error')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        },
        true
      );

      // Clear any stale Service Worker CacheStorage entries from older versions
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            caches.delete(k);
          });
        });
      }

      // In cross-site preview iframes, unregister Service Workers so Partitioned auth cookies work cleanly.
      // When opened directly on a phone or browser tab (window.self === window.top), register /sw.js for native phone notifications.
      if ('serviceWorker' in navigator) {
        if (window.self !== window.top) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        } else {
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__deferredPwaPrompt = e;
          });
          window.addEventListener('load', function () {
            var baseScope = window.location.pathname.startsWith('/boosthub')
              ? '/boosthub/'
              : '/';
            navigator.serviceWorker
              .register(baseScope + 'sw.js?v=34', { scope: baseScope })
              .then(function (reg) {
                if (reg && typeof reg.update === 'function') {
                  reg.update().catch(function () {});
                }
              })
              .catch(function () {});
          });
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #060813;
          color: #f8fafc;
          gap: 12px;
        "
      >
        <div
          style="
            width: 38px;
            height: 38px;
            border-radius: 9999px;
            border: 3px solid rgba(59, 130, 246, 0.25);
            border-top-color: #3b82f6;
            animation: bh-spin 0.8s linear infinite;
          "
        ></div>
        <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.02em;">
          BoostHub
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (
        typeof window !== 'undefined' &&
        document.querySelector('script[src*="/src/main.tsx"]') &&
        (window.location.hostname.endsWith('.github.io') ||
          window.location.hostname.endsWith('.pages.dev') ||
          window.location.hostname.endsWith('.netlify.app'))
      ) {
        var ghCss = document.createElement('link');
        ghCss.rel = 'stylesheet';
        ghCss.href = './gh-bundle/app.css?v=34';
        document.head.appendChild(ghCss);
        var ghJs = document.createElement('script');
        ghJs.type = 'module';
        ghJs.src = './gh-bundle/app.js?v=34';
        document.body.appendChild(ghJs);
      }
    </script>
  </body>
</html>

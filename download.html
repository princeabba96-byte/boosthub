<!doctype html>
<html lang="en" style="background-color: #0A0A0A; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A84FF" />
    <title>Download BoostHub App (APK)</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, rgba(10, 132, 255, 0.22), transparent 55%), #0A0A0A;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #111625;
        border: 1px solid rgba(0, 229, 255, 0.28);
        border-radius: 28px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(10, 132, 255, 0.18);
      }
      .icon {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        border: 2px solid rgba(0, 229, 255, 0.5);
        box-shadow: 0 0 28px rgba(10, 132, 255, 0.45);
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        font-size: 13px;
        line-height: 1.5;
        color: #94a3b8;
      }
      .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 15px 20px;
        border-radius: 16px;
        background: linear-gradient(90deg, #0A84FF, #00E5FF);
        color: #0A0A0A;
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
        box-shadow: 0 0 24px rgba(10, 132, 255, 0.45);
        margin-bottom: 12px;
      }
      .btn-secondary {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 18px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f8fafc;
        font-weight: 600;
        font-size: 13px;
        text-decoration: none;
      }
      .status {
        margin-top: 16px;
        font-size: 12px;
        color: #00E5FF;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./icons/icon-512x512.png" alt="BoostHub" class="icon" />
      <h1>Downloading BoostHub...</h1>
      <p>
        Your download of <strong>BoostHub.apk</strong> (Social &amp; Creator Platform — Capshots, Stories, Messaging &amp; B-Shop) is starting automatically.
      </p>
      <a id="dlBtn" href="./BoostHub.apk" download="BoostHub.apk" class="btn-primary">
        <span>⬇ Download BoostHub.apk</span>
      </a>
      <a href="./" class="btn-secondary">
        Open BoostHub Web App
      </a>
      <div class="status" id="statusText">Starting automatic APK download...</div>
    </div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var a = document.createElement('a');
          a.href = './BoostHub.apk';
          a.download = 'BoostHub.apk';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          var st = document.getElementById('statusText');
          if (st) {
            st.textContent = 'If your download did not start automatically, tap the blue button above.';
          }
        }, 400);
      });
    </script>
  </body>
</html>
